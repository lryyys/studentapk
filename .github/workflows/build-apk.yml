name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find and build with Gradle
        run: |
          # Ищем, где находится gradlew в репозитории
          GRADLEW_PATH=$(find . -name "gradlew" -type f)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Ошибка: файл gradlew не найден!"
            exit 1
          fi
          
          # Получаем папку, где лежит gradlew
          ANDROID_DIR=$(dirname "$GRADLEW_PATH")
          echo "Найжена папка Android: $ANDROID_DIR"
          
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
