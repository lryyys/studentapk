name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          # Автоматически находим папку, где лежит файл build.gradle.kts или build.gradle
          ANDROID_DIR=$(find . -name "build.gradle.kts" -o -name "build.gradle" | xargs dirname | head -n 1)
          
          if [ -z "$ANDROID_DIR" ]; then
            echo "Ошибка: Не найдены файлы сборки Android!"
            exit 1
          fi

          echo "Найжена папка проекта: $ANDROID_DIR"
          cd "$ANDROID_DIR"

          # Если файла gradlew нет, генерируем его автоматически
          if [ ! -f "./gradlew" ]; then
            echo "Генерируем Gradle Wrapper..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
