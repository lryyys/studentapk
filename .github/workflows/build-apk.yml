name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Auto-generate Gradle Wrapper and Build APK
        run: |
          # Ищем папку android в репозитории
          if [ -d "android" ]; then
            cd android
          else
            # Если папки нет в корне, ищем где лежит build.gradle
            BUILD_DIR=$(find . -name "build.gradle.kts" -o -name "build.gradle" | xargs dirname | head -n 1)
            if [ -n "$BUILD_DIR" ]; then
              cd "$BUILD_DIR"
            fi
          fi

          echo "Текущая рабочая директория: $(pwd)"

          # Если gradlew отсутствует, устанавливаем gradle и генерируем оболочку автоматически
          if [ ! -f "./gradlew" ]; then
            echo "Файл gradlew не найден. Генерируем через gradle wrapper..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
